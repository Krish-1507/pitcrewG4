<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PitCrew Mission Control</title>
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">PC</span>
          <div class="brand-text">
            <strong>PitCrew</strong>
            <span class="muted">Mission Control</span>
          </div>
        </div>
        <button id="new-mission" class="primary block">+ New mission</button>
        <div class="side-section">
          <span class="side-label">Missions</span>
          <div id="mission-list" class="mission-list">
            <span class="muted small">Loading…</span>
          </div>
        </div>
        <div class="side-section">
          <span class="side-label">Workspace</span>
          <nav id="nav">
            <a href="#/quick">Quick assistant</a>
            <a href="#/home">Project home</a>
            <a href="#/memory">Memory</a>
            <a href="#/assistants">Assistants</a>
            <a href="#/approvals">Approvals</a>
            <a href="#/story">Repo story</a>
            <a href="#/browser">Browser lab</a>
            <a href="#/providers">Providers</a>
          </nav>
        </div>
        <div class="side-foot">
          <span id="conn" class="conn">connecting…</span>
        </div>
      </aside>
      <main id="view" aria-live="polite"></main>
    </div>
    <script src="/ui/app.js" type="module"></script>
  </body>
</html>
